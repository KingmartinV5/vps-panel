{{define "backups"}}
<div class="page-header">
  <h1>{{.Server.Name}}</h1>
  <div class="tabs">
    <a class="tab" href="/server/{{.Server.ID}}">Console</a>
    <a class="tab" href="/server/{{.Server.ID}}/files">Files</a>
    <span class="tab active">Backups</span>
    {{if .PluginsEligible}}<a class="tab" href="/server/{{.Server.ID}}/plugins">Plugins</a>{{end}}
  </div>
</div>

<form method="post" action="/server/{{.Server.ID}}/backups/create">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <button type="submit" class="btn btn-blue">Create Backup Now</button>
</form>

<table class="file-table">
  <thead><tr><th>File</th><th>Size</th><th>Created</th><th></th></tr></thead>
  <tbody>
    {{if not .Backups}}
    <tr><td colspan="4" class="muted">No backups yet.</td></tr>
    {{else}}
    {{range .Backups}}
    <tr>
      <td>{{.Filename}}</td>
      <td>{{.SizeMBStr}} MB</td>
      <td>{{.MTimeStr}}</td>
      <td class="row-actions">
        <a href="/server/{{$.Server.ID}}/backups/{{.Filename}}/download">Download</a>
        <form class="inline-form" method="post" action="/server/{{$.Server.ID}}/backups/{{.Filename}}/delete" onsubmit="return confirm('Delete this backup?');">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button type="submit" class="link-btn danger">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
    {{end}}
  </tbody>
</table>
{{end}}
