{{define "admin_users"}}
<h1>Users</h1>

<table class="file-table">
  <thead><tr><th>Username</th><th>Role</th><th>Servers</th><th></th></tr></thead>
  <tbody>
    {{range .Users}}
    <tr>
      <td>{{.Username}}</td>
      <td>{{.Role}}</td>
      <td>{{.ServerCount}}</td>
      <td class="row-actions">
        <a href="/admin/users/{{.ID}}/edit">Edit</a>
        {{if .ShowDelete}}
        <form class="inline-form" method="post" action="/admin/users/{{.ID}}/delete" onsubmit="return confirm('Delete user {{.Username}}?');">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button type="submit" class="link-btn danger">Delete</button>
        </form>
        {{end}}
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

<h2>Create User</h2>
<form method="post" action="/admin/users/create" class="panel-form">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>Username <input type="text" name="username" required></label>
  <label>Password <input type="password" name="password" minlength="8" required></label>
  <label class="checkbox-label"><input type="checkbox" name="is_admin"> Grant admin access</label>
  <button type="submit" class="btn btn-blue">Create</button>
</form>
{{end}}
