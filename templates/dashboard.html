{{define "dashboard"}}
<h1>Your Servers</h1>
{{if not .Servers}}
  <p class="muted">No servers yet.{{if .CurrentUser.IsAdmin}} <a href="/admin/servers/create">Create one</a>.{{end}}</p>
{{else}}
<div class="server-grid">
  {{range .Servers}}
  <a class="server-card" href="{{.URL}}">
    <div class="server-card-top">
      <span class="status-dot status-{{.Status}}"></span>
      <span class="server-name">{{.Name}}</span>
    </div>
    <div class="server-card-meta">{{.Image}}</div>
    <div class="server-card-meta">{{.Status}} · {{.MemoryMB}} MB
      {{if .HasOwner}} · owner: {{.OwnerUsername}}{{end}}
    </div>
  </a>
  {{end}}
</div>
{{end}}
{{end}}
