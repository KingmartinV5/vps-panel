{{define "admin_create_server"}}
<h1>Create Server</h1>
<form method="post" class="panel-form">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label>Name
    <input type="text" name="name" value="{{.FormName}}" required>
  </label>
  <label>Image
    <select name="image" required>
      {{range .AllowedImages}}
      <option value="{{.}}" {{if eq $.FormImage .}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
  <label>Memory limit (MB)
    <input type="number" name="memory_mb" min="256" step="256" value="{{.FormMemory}}" required>
  </label>
  <label>Port mappings (one per line, hostport:containerport[/tcp|udp])
    <textarea name="ports" rows="3" placeholder="25565:25565">{{.FormPorts}}</textarea>
  </label>
  <label>Environment variables (one per line, KEY=VALUE)
    <textarea name="env" rows="4" placeholder="EULA=TRUE&#10;MEMORY=2048M">{{.FormEnv}}</textarea>
  </label>
  <label>Owner (customer)
    <select name="owner_id">
      <option value="">— unassigned —</option>
      {{range .Customers}}
      <option value="{{.ID}}" {{if eq $.FormOwnerID (idstr .ID)}}selected{{end}}>{{.Username}}</option>
      {{end}}
    </select>
  </label>
  <button type="submit" class="btn btn-blue">Create Server</button>
</form>
{{end}}
