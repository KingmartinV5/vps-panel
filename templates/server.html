{{define "server"}}
<div class="page-header">
  <h1><span class="status-dot status-{{.Status}}"></span> {{.Server.Name}}</h1>
  <div class="tabs">
    <span class="tab active"><svg class="tab-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7.5 9 10.5 5.5 13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="10.5" y1="13.5" x2="14.5" y2="13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Console</span>
    <a class="tab" href="/server/{{.Server.ID}}/files"><svg class="tab-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5.5c0-.83.67-1.5 1.5-1.5H8l2 2h6.5c.83 0 1.5.67 1.5 1.5v7c0 .83-.67 1.5-1.5 1.5h-13C2.67 16 2 15.33 2 14.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Files</a>
    <a class="tab" href="/server/{{.Server.ID}}/backups"><svg class="tab-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="15" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 7v7.5c0 .83.67 1.5 1.5 1.5h10c.83 0 1.5-.67 1.5-1.5V7" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="10" x2="12" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Backups</a>
    {{if .PluginsEligible}}<a class="tab" href="/server/{{.Server.ID}}/plugins"><svg class="tab-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 3.5v2h-2a1.5 1.5 0 0 0-1.5 1.5v2h-1.5a1.5 1.5 0 1 0 0 3H4v2A1.5 1.5 0 0 0 5.5 15.5h2v-1.5a1.5 1.5 0 1 1 3 0v1.5h2A1.5 1.5 0 0 0 14 14v-2h1.5a1.5 1.5 0 1 0 0-3H14V7a1.5 1.5 0 0 0-1.5-1.5h-2v-2a1.5 1.5 0 1 0-3 0Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Plugins</a>{{end}}
    {{if .CurrentUser.IsAdmin}}<a class="tab" href="/server/{{.Server.ID}}/edit"><svg class="tab-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 3.5 16 7l-8.5 8.5-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Edit</a>{{end}}
  </div>
</div>

<div class="power-row">
  <form method="post" action="/server/{{.Server.ID}}/power">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="action" value="start">
    <button type="submit" class="btn btn-green">
      <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><polygon points="5,3 17,10 5,17" fill="currentColor"/></svg>
      Start
    </button>
  </form>
  <form method="post" action="/server/{{.Server.ID}}/power">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="action" value="restart">
    <button type="submit" class="btn btn-amber">
      <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 1 2 4.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><polygon points="3,10 6.2,10.2 4.6,13.4" fill="currentColor"/></svg>
      Restart
    </button>
  </form>
  <form method="post" action="/server/{{.Server.ID}}/power">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="action" value="stop">
    <button type="submit" class="btn btn-red">
      <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
      Stop
    </button>
  </form>
  <form method="post" action="/server/{{.Server.ID}}/power" onsubmit="return confirm('Force kill the server process?');">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="action" value="kill">
    <button type="submit" class="btn btn-outline-red">
      <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><line x1="5" y1="5" x2="15" y2="15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="15" y1="5" x2="5" y2="15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Kill
    </button>
  </form>

  <div class="stats-inline" id="stats-inline">
    <span>CPU <b id="stat-cpu">–</b></span>
    <span>RAM <b id="stat-mem">–</b></span>
  </div>
</div>

<div id="console-box" class="console-box"></div>

<form id="console-form" class="console-input-row">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="text" id="console-input" autocomplete="off" placeholder="Type a command and press Enter…">
  <button type="submit" class="btn btn-blue">Send</button>
</form>

{{if .CurrentUser.IsAdmin}}
<div class="danger-zone">
  <h3>Danger zone</h3>
  <form method="post" action="/server/{{.Server.ID}}/reset-world"
        onsubmit="return confirm('Reset this server\'s world data? This deletes the world/world_nether/world_the_end (or worlds/ for Bedrock) folders -- server.properties, plugins, and other files are kept. This cannot be undone.');">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn btn-outline-red">
      <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10a7 7 0 1 1 2.4 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="2,10 5,10.3 3.6,14" fill="currentColor"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
      Reset World Data
    </button>
  </form>
  <form method="post" action="/server/{{.Server.ID}}/delete" style="margin-top: 12px;"
        onsubmit="return confirm('Permanently delete this server\'s container? This cannot be undone.');">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="checkbox-label"><input type="checkbox" name="delete_data"> also delete data directory ({{.Server.DataPath}})</label>
    <button type="submit" class="btn btn-outline-red">Delete Server</button>
  </form>
</div>
{{end}}

<script>
  window.SERVER_ID = {{.Server.ID}};
  window.CSRF_TOKEN = "{{.CSRFToken}}";
</script>
<script src="/static/js/console.js"></script>
{{end}}
